spring.application.name=server

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/plant_pals
spring.datasource.username=plant_pals_user
spring.datasource.password=password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=jFNyPMxY8OGRy6RfDb4dwqwirqJuCq8y1zrQScxS+H+dz56INeN4xIWe6jr2icUc
# a day
jwt.expiration-ms=86400000

# Auth is fully custom (JWT-based); avoid Spring Boot generating a random default-user password
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ActiveMQ — embedded broker (no external broker needed for dev)
spring.activemq.in-memory=true
spring.activemq.pool.enabled=false

# JMS topic name (used by NotificationPublisher and NotificationListener)
jms.topic.plant-notifications=plant.notifications
